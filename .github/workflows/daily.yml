name: Daily Delivery

on:
  schedule:
    # 平日 4:00 JST（= 前日 19:00 UTC）。日〜木 UTC が 月〜金 JST に対応する。
    # 実測で Actions の遅延が 72 分出たため、6:20 出発までの余裕を 140 分に広げた。
    - cron: '0 19 * * 0-4'
  workflow_dispatch: # 手動実行用

# data/history.json をコミットするために書き込み権限が必要
permissions:
  contents: write

concurrency:
  group: tech-reader-daily
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Deliver today's article
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Bot Token は絵文字の事前付与にのみ使う。未設定でも配信は成立する。
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: python -m tech_reader.main

      - name: Commit history
        run: |
          if [ -n "$(git status --porcelain data/history.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/history.json
            git commit -m "chore: 配信履歴を更新"
            git push
          else
            echo "履歴に変更なし"
          fi
